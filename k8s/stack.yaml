---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ml-serving
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: ml-gateway:local
          imagePullPolicy: Never
          args: ["/config/gateway.json"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
      volumes:
        - name: config
          configMap: {name: gateway-config}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ml-serving
spec:
  type: NodePort
  selector: {app: gateway}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: naive
  namespace: ml-serving
spec:
  replicas: 1
  selector:
    matchLabels: {app: naive}
  template:
    metadata:
      labels: {app: naive}
    spec:
      containers:
        - name: gateway
          image: ml-gateway:local
          imagePullPolicy: Never
          args: ["/config/gateway.json"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 2
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
      volumes:
        - name: config
          configMap: {name: naive-config}
---
apiVersion: v1
kind: Service
metadata:
  name: naive
  namespace: ml-serving
spec:
  type: NodePort
  selector: {app: naive}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30081}]
---
apiVersion: v1
kind: Pod
metadata:
  name: loadgen
  namespace: ml-serving
  labels: {app: loadgen}
spec:
  restartPolicy: Never
  containers:
    - name: loadgen
      image: ml-loadgen:local
      imagePullPolicy: Never
      command: ["sleep", "infinity"]
      volumeMounts:
        - {name: work, mountPath: /work}
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits: {memory: 256Mi}
  volumes:
    - name: work
      emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: ml-serving
spec:
  replicas: 1
  selector:
    matchLabels: {app: redpanda}
  template:
    metadata:
      labels: {app: redpanda}
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.2.11
          imagePullPolicy: IfNotPresent
          command:
            - redpanda
            - start
            - --overprovisioned
            - --smp
            - "1"
            - --memory
            - 384M
            - --reserve-memory
            - 0M
            - --node-id
            - "0"
            - --kafka-addr
            - internal://0.0.0.0:9092
            - --advertise-kafka-addr
            - internal://redpanda:9092
          ports: [{containerPort: 9092}]
          resources:
            requests: {cpu: 50m, memory: 384Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: ml-serving
spec:
  selector: {app: redpanda}
  ports: [{port: 9092, targetPort: 9092}]
