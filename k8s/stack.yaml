apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranking-v2
  namespace: ml-serving
spec:
  replicas: 1
  selector:
    matchLabels: {app: ranking-v2}
  template:
    metadata:
      labels: {app: ranking-v2}
    spec:
      containers:
        - name: ranking
          image: ml-ranking:local
          imagePullPolicy: Never
          ports: [{containerPort: 8000}]
          env:
