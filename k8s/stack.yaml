apiVersion: v1
kind: Namespace
metadata:
  name: ml-serving
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: featureserver
  namespace: ml-serving
spec:
  replicas: 1
  selector:
    matchLabels: {app: featureserver}
  template:
    metadata:
      labels: {app: featureserver}
    spec:
      containers:
        - name: featureserver
          image: ml-featureserver:local
          ports: [{containerPort: 8080}]
          env:
            - {name: HOST, value: "0.0.0.0"}
            - {name: PORT, value: "8080"}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 2
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: featureserver
  namespace: ml-serving
spec:
  selector: {app: featureserver}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranking
  namespace: ml-serving
spec:
  replicas: 2
  selector:
    matchLabels: {app: ranking}
  template:
    metadata:
      labels: {app: ranking}
    spec:
      containers:
        - name: ranking
          image: ml-ranking:local
          ports: [{containerPort: 8000}]
          env:
            - {name: HOST, value: "0.0.0.0"}
            - {name: PORT, value: "8000"}
            - {name: MODEL_KIND, value: ranking}
            - {name: MODEL_PATH, value: /models/ranking.onnx}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}
      volumes:
        - name: models
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ranking
  namespace: ml-serving
spec:
  selector: {app: ranking}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranking-canary
  namespace: ml-serving
spec:
  replicas: 1
  selector:
    matchLabels: {app: ranking-canary}
  template:
    metadata:
      labels: {app: ranking-canary}
    spec:
      containers:
        - name: ranking
          image: ml-ranking:local
          ports: [{containerPort: 8000}]
          env:
            - {name: HOST, value: "0.0.0.0"}
            - {name: PORT, value: "8000"}
            - {name: MODEL_KIND, value: ranking}
            - {name: MODEL_PATH, value: /models/ranking.onnx}
            - {name: FAULT_ERROR_RATE, value: "0.9"}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ranking-canary
  namespace: ml-serving
spec:
  selector: {app: ranking-canary}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: text-model
  namespace: ml-serving
spec:
  replicas: 1
  selector:
    matchLabels: {app: text-model}
  template:
    metadata:
      labels: {app: text-model}
    spec:
      containers:
        - name: text
          image: ml-ranking:local
          ports: [{containerPort: 8000}]
          env:
            - {name: HOST, value: "0.0.0.0"}
            - {name: PORT, value: "8000"}
            - {name: MODEL_KIND, value: text}
            - {name: MODEL_PATH, value: /models/text.onnx}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: text-model
  namespace: ml-serving
spec:
  selector: {app: text-model}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ml-serving
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: ml-gateway:local
          args: ["/config/gateway.json"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health, port: 8080}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ml-serving
spec:
  type: NodePort
  selector: {app: gateway}
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ranking
  namespace: ml-serving
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ranking
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: ml-serving
spec:
  replicas: 1
  selector:
    matchLabels: {app: redpanda}
  template:
    metadata:
      labels: {app: redpanda}
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.2.11
          command:
            - redpanda
            - start
            - --overprovisioned
            - --smp
            - "1"
            - --memory
            - 512M
            - --reserve-memory
            - 0M
            - --node-id
            - "0"
            - --kafka-addr
            - internal://0.0.0.0:9092
            - --advertise-kafka-addr
            - internal://redpanda:9092
          ports: [{containerPort: 9092}]
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: ml-serving
spec:
  selector: {app: redpanda}
  ports: [{port: 9092, targetPort: 9092}]
