apiVersion: v1
kind: Namespace
metadata:
  name: ml-serving
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: featureserver
  namespace: ml-serving
spec:
  replicas: 1
  selector:
    matchLabels: {app: featureserver}
  template:
    metadata:
      labels: {app: featureserver}
    spec:
      containers:
        - name: featureserver
          image: ml-featureserver:local
          imagePullPolicy: Never
          ports: [{containerPort: 8080}]
          env:
            - {name: HOST, value: "0.0.0.0"}
            - {name: PORT, value: "8080"}
            - {name: TOKIO_WORKER_THREADS, value: "2"}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: featureserver
  namespace: ml-serving
spec:
  type: NodePort
  selector: {app: featureserver}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30082}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyfeatures
  namespace: ml-serving
spec:
  replicas: 1
  selector:
    matchLabels: {app: pyfeatures}
  template:
    metadata:
      labels: {app: pyfeatures}
    spec:
      containers:
        - name: pyfeatures
          image: ml-ranking:local
          imagePullPolicy: Never
          command: ["python", "/app/feature_baseline.py"]
          ports: [{containerPort: 8080}]
          env:
            - {name: HOST, value: "0.0.0.0"}
            - {name: PORT, value: "8080"}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: pyfeatures
  namespace: ml-serving
spec:
  type: NodePort
  selector: {app: pyfeatures}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30083}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranking-a
  namespace: ml-serving
spec:
  replicas: 1
  selector:
    matchLabels: {app: ranking-a}
  template:
    metadata:
      labels: {app: ranking-a}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: ranking
          image: ml-ranking:local
          imagePullPolicy: Never
          ports: [{containerPort: 8000}]
          env:
            - {name: HOST, value: "0.0.0.0"}
            - {name: PORT, value: "8000"}
            - {name: MODEL_KIND, value: ranking}
            - {name: MODEL_PATH, value: /models/ranking.onnx}
            - {name: OMP_NUM_THREADS, value: "1"}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 320Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ranking-a
  namespace: ml-serving
spec:
  type: NodePort
  selector: {app: ranking-a}
  ports: [{port: 8000, targetPort: 8000, nodePort: 30085}]
---
